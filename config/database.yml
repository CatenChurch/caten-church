default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("DB_POOL", 10) %>

local: &local
  <<: *default
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %> # tcp instead of unix socket
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>

development:
  <<: *local
  database: caten_church_dev

test:
  <<: *local
  database: caten_church_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] || Rails.application.credentials.dig(:production, :database_url) %>
