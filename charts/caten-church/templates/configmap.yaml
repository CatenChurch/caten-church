apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "caten-church.fullname" . }}
  labels:
    {{- include "caten-church.labels" . | nindent 4 }}
  {{- include "caten-church.configHookAnnotations" . | nindent 2 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
