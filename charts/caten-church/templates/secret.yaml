{{- if and .Values.secrets (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "caten-church.fullname" . }}
  labels:
    {{- include "caten-church.labels" . | nindent 4 }}
  {{- include "caten-church.configHookAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
