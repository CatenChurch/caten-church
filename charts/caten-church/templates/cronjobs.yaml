{{- range $name, $job := .Values.cronJobs }}
{{- if $job.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-%s" (include "caten-church.fullname" $) $name | trunc 52 | trimSuffix "-" }}
  labels:
    {{- include "caten-church.labels" $ | nindent 4 }}
    app.kubernetes.io/component: cron
spec:
  schedule: {{ $job.schedule | quote }}
  {{- with $job.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "caten-church.selectorLabels" $ | nindent 12 }}
            app.kubernetes.io/component: cron
        spec:
          {{- include "caten-church.podSpecCommon" $ | nindent 10 }}
          restartPolicy: Never
          containers:
            - name: {{ $name }}
              image: {{ include "caten-church.image" $ }}
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              args:
                {{- toYaml $job.command | nindent 16 }}
              securityContext:
                {{- toYaml $.Values.securityContext | nindent 16 }}
              {{- include "caten-church.envFrom" $ | nindent 14 }}
{{- end }}
{{- end }}
