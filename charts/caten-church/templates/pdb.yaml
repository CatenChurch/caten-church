{{- if .Values.web.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "caten-church.fullname" . }}-web
  labels:
    {{- include "caten-church.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "caten-church.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
{{- end }}
