{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "caten-church.serviceAccountName" . }}
  labels:
    {{- include "caten-church.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations .Values.migrations.enabled }}
  annotations:
    {{- if .Values.migrations.enabled }}
    # Must exist before the pre-install migration Job.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
